appId: com.rakazo.app
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Rakazo"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Rakazo"
    timeout: 60000
- tapOn: "Email"
- inputText: ${RAKAZO_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# The sign-in POST can outlast the app's 8s request timeout while the shared runner is busy
# (the screen then says "Request timed out" and clears the password). A person taps Sign in
# again; do the same, twice at most. Any other outcome (including Keychain/SecureStore
# save failure) still fails here with a clear screen.
- extendedWaitUntil:
    visible: "Account|.*How did you hear about us.*|Could not save your sign-in|.*Request timed out.*"
    timeout: 45000
- runFlow:
    when:
      visible: ".*Request timed out.*"
    commands:
      - tapOn: "Password"
      - eraseText: 60
      - inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
      - hideKeyboard
      - tapOn: "Sign in"
      - extendedWaitUntil:
          visible: "Account|.*How did you hear about us.*|Could not save your sign-in|.*Request timed out.*"
          timeout: 45000
- runFlow:
    when:
      visible: ".*Request timed out.*"
    commands:
      - tapOn: "Password"
      - eraseText: 60
      - inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
      - hideKeyboard
      - tapOn: "Sign in"
      - extendedWaitUntil:
          visible: "Account|.*How did you hear about us.*|Could not save your sign-in"
          timeout: 60000
- runFlow:
    when:
      visible: ".*Could not save your sign-in.*"
    commands:
      - assertVisible: "Account"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
# A new account answers the signup survey before the inbox.
- extendedWaitUntil:
    visible: "Account|.*How did you hear about us.*"
    timeout: 90000
