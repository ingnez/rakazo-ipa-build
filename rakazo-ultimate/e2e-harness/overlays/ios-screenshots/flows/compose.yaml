appId: com.rakazo.app
name: Compose
# Whatever happens below, the next flow must start in English again.
onFlowComplete:
  - openLink: "rakazo:///language"
  - tapOn:
      text: "Open"
      optional: true
  - extendedWaitUntil:
      visible: "English"
      timeout: 60000
  - tapOn: "English"
  - waitForAnimationToEnd:
      timeout: 3000
---
# New-bot sheet (the picker is the OpenMinis shape + colour picker; every tile is what the avatar
# becomes) and the Chinese UI: no English label, raw placeholder or half-translated row may show.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
# English first (the simulator is forced to en_US).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///new-bot"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Give your Bot a name"
          timeout: 60000
- waitForAnimationToEnd:
    timeout: 4000
# The simulator's first-keyboard tip ("sliding your finger across the letters") covers the sheet.
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: ".*(Colour|Emblem).*"
- takeScreenshot: 05-new-bot-en
- tapOn: "Close"
- waitForAnimationToEnd:
    timeout: 2000
# Switch the app language to 简体中文 (Settings > Language), exactly as a person would.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///language"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "简体中文"
          timeout: 60000
- tapOn: "简体中文"
- extendedWaitUntil:
    visible: "语言"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-language-zh
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///new-bot"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "为 Bot 取个名字"
          timeout: 60000
- waitForAnimationToEnd:
    timeout: 4000
- assertNotVisible: ".*(Colour|Emblem|Create new Bot|Give your Bot a name).*"
- takeScreenshot: 11-new-bot-zh
- runFlow:
    when:
      visible: "形状 4"
    commands:
      - tapOn: "形状 4"
      - tapOn: "颜色 6"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 12-new-bot-picked-zh
- inputText: "Barista"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 13-new-bot-named-zh
# Create it (fixture account; the server fixture accepts it): the picked look must be accepted by
# bots/create and the chat must open.
# The keyboard covers the Create button, so submit from the keyboard (its Done key creates).
# A create that outlasts the app's 8s timeout leaves the sheet open with an error; submit again, as a
# person would (the chat composer, "...发消息", only exists once the bot was created).
- retry:
    maxRetries: 2
    commands:
      - pressKey: Enter
      - extendedWaitUntil:
          visible: ".*发消息.*"
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ".*(无法创建|Could not create).*"
- takeScreenshot: 14-after-create-zh
- openLink: "rakazo:///usage"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 15-usage-zh
- openLink: "rakazo:///labs"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 16-labs-zh
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///account"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "settings-account-hub"
          timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 17-account-zh
