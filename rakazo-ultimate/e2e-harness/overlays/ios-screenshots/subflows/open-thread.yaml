appId: com.rakazo.app
---
# Opens the fixture Researcher thread and waits for it to be usable.
# The app gives every request 8s; on the shared runner the API stalled 6-19s at times (runs
# 45966108508, 46122053238), which leaves the thread under "Could not reach the server" until it is
# opened afresh. A person goes back and opens it again, so do that: up to three more opens.
# (patch-open-in-bot.py adds the optional "Open" tap after this top-level openLink; the nested ones
# carry their own.)
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 90000
# Give a slow first load time to finish by itself before reopening.
- extendedWaitUntil:
    notVisible: ".*Could not reach the server.*"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: ".*Could not reach the server.*"
    commands:
      - waitForAnimationToEnd:
          timeout: 8000
      # Leave the thread first: opening the same URL on the screen that is already showing it does
      # not remount it, so its failed load would never run again (run 46122053238).
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Message Researcher"
          timeout: 60000
      - extendedWaitUntil:
          notVisible: ".*Could not reach the server.*"
          timeout: 20000
          optional: true
- runFlow:
    when:
      visible: ".*Could not reach the server.*"
    commands:
      - waitForAnimationToEnd:
          timeout: 15000
      # Leave the thread first: opening the same URL on the screen that is already showing it does
      # not remount it, so its failed load would never run again (run 46122053238).
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Message Researcher"
          timeout: 60000
      - extendedWaitUntil:
          notVisible: ".*Could not reach the server.*"
          timeout: 20000
          optional: true
- runFlow:
    when:
      visible: ".*Could not reach the server.*"
    commands:
      - waitForAnimationToEnd:
          timeout: 25000
      # Leave the thread first: opening the same URL on the screen that is already showing it does
      # not remount it, so its failed load would never run again (run 46122053238).
      - tapOn:
          text: "Back"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Message Researcher"
          timeout: 60000
      - extendedWaitUntil:
          notVisible: ".*Could not reach the server.*"
          timeout: 20000
          optional: true
- assertNotVisible: ".*Could not reach the server.*"
