appId: com.rakazo.app
name: Thread
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- runFlow: ../subflows/open-thread.yaml
# Newer fixture messages (Launch dashboard / picture stack) pin the live end; READY
# sits above the fold. Scroll it on-screen, then assert — do not drop the check.
- scrollUntilVisible:
    element: ".*The fixture workspace is ready.*"
    direction: UP
    timeout: 75000
    visibilityPercentage: 40
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-thread
# The file card renders under READY. No text selector ever matched it (runs 45994571354,
# 46011113796: not ".txt", not the size, not the sheet text), so it is found by its testID. Small
# swipes, so the card is not scrolled past between two checks (run 45981903828 ended at the live end).
- scrollUntilVisible:
    element:
      id: "file-attachment-card"
    direction: DOWN
    timeout: 45000
    visibilityPercentage: 60
    speed: 20
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-attachment
# 01-thread shows the empty composer (mic and Call); a typed draft swaps Call for Send.
- tapOn: "Message Researcher"
- inputText: "Summarize the launch notes"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02b-composer-typed
# No hideKeyboard here: the chat composer is a custom input and Maestro cannot dismiss its keyboard
# (run 46025550372 failed on it). The next step navigates to another screen, which drops focus.
- eraseText: 40
- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: ".*The fixture launch plan is ready.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-group-thread
- runFlow: ../subflows/open-thread.yaml
- scrollUntilVisible:
    element: ".*The fixture workspace is ready.*"
    direction: UP
    timeout: 75000
    visibilityPercentage: 40
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 30000
- longPressOn:
    text: ".*The fixture workspace is ready.*"
- extendedWaitUntil:
    visible: ".*Reply.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: ".*Reply.*"
    commands:
      - assertVisible: ".*Copy.*"
      - assertVisible: ".*Speak message|朗读消息.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 04-message-actions
      - tapOn: "Copy"
- scrollUntilVisible:
    element: ".*Fixture picture stack.*"
    direction: DOWN
    timeout: 45000
    visibilityPercentage: 40
- assertVisible: ".*2.*图片|2 images|Fixture picture stack.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04b-image-stack
- runFlow: ../subflows/open-thread.yaml
# The catalog's offline billing has invites on, so the Pro account always sees the gift.
- runFlow: ../subflows/open-thread.yaml
# "Invite a friend" lives in the chat header's "Chat actions" menu (the fork's header), and only
# shows once billing/status has told the app that invites are on. If that read was slow the item is
# missing: close the menu, reopen the thread (re-reads billing) and try once more.
- tapOn: "Chat actions"
- extendedWaitUntil:
    visible: "Invite a friend"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Invite a friend"
    commands:
      - tapOn:
          point: "50%,40%"
      - waitForAnimationToEnd:
          timeout: 15000
      - runFlow: ../subflows/open-thread.yaml
      - tapOn: "Chat actions"
- extendedWaitUntil:
    visible: "Invite a friend"
    timeout: 45000
- tapOn: "Invite a friend"
- extendedWaitUntil:
    visible: ".*2 weeks free.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-invite
- runFlow: ../subflows/open-thread.yaml
# LAST on purpose (run 46011113796: the card never matched by text, so this step cost the whole
# thread flow). The card has a testID now; the harness also saves hierarchy-thread-probe.json.
# A fresh open lands on the live end; the file card sits ABOVE the Launch dashboard card and the
# picture stack, so it is reached by scrolling UP (DOWN was a no-op there). Centre it so it is not
# left under the glass header, whose overlap kept it under 100% visible.
- scrollUntilVisible:
    element:
      id: "file-attachment-card"
    direction: UP
    timeout: 60000
    visibilityPercentage: 80
    speed: 20
    centerElement: true
- tapOn:
    id: "file-attachment-card"
- extendedWaitUntil:
    visible: ".*(Collect three customer quotes|launch-notes).*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-attachment-preview
