appId: com.rakazo.app
name: Settings
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///account"
      # Account hub: InsetRow a11y label is "title, detail" (and icons used to leak SF names).
      # Prefer testID; regex keeps a text fallback. Do not drop this readiness check.
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "settings-account-hub"
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: "settings-row-profile"
          timeout: 45000
- assertVisible:
    id: "settings-row-vault"
- assertVisible:
    id: "settings-row-integrations"
# The hub reads `me` on focus with an 8s request timeout and ignores failure, so one slow
# answer leaves "Your account" until the next focus (run 45966108508: me took 10-17s).
# Wait for the name; if it is still the fallback, leave and come back (re-reads me), as a person would.
- extendedWaitUntil:
    visible: ".*Screenshot User.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible: ".*Screenshot User.*"
    commands:
      - tapOn:
          id: "settings-row-profile"
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible:
            id: "settings-account-hub"
          timeout: 45000
- extendedWaitUntil:
    visible: ".*Screenshot User.*"
    timeout: 90000
- scrollUntilVisible:
    element: "General|通用"
    direction: DOWN
    timeout: 45000
    visibilityPercentage: 40
- extendedWaitUntil:
    visible: "General|通用"
    timeout: 30000
- assertNotVisible: "(?s).*__[A-Za-z0-9]+__.*"
- assertNotVisible: "(?is).*[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}.*"
- assertNotVisible: "(?s).*c[a-z0-9]{24}.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-account
- tapOn: "General|通用"
- extendedWaitUntil:
    visible: "Stream replies"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-general
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-general-dark
- tapOn: "System"
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///profile"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: ".*Change password.*"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-profile
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///change-password"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Current password"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-change-password
- tapOn: "Current password"
- inputText: "wrong-current"
- tapOn: "New password"
- inputText: "replacement-1"
- tapOn: "Confirm password"
- inputText: "replacement-2"
- hideKeyboard
- tapOn:
    text: "Change password"
    index: 1
- extendedWaitUntil:
    visible: "Passwords do not match"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-password-mismatch
- tapOn: "Back"
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///models"
      # Titles here are locale-mixed (the fork hard-codes 日常帮助 / 场景模型), so wait on ids:
      # the page, the main-model group, the scenes group; and no error banner.
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "settings-models-screen"
          timeout: 60000
      # The groups render once `me` has loaded; a read that outlasts the app's 8s timeout shows
      # the page's Retry instead, as it would for a person.
- extendedWaitUntil:
    visible:
      id: "settings-models-main"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
- extendedWaitUntil:
    visible:
      id: "settings-models-main"
    timeout: 90000
- assertVisible:
    id: "settings-models-scenarios"
- assertNotVisible:
    id: "settings-models-error"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-models
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///integrations"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Search apps.*"
          timeout: 45000
      - extendedWaitUntil:
          visible: ".*Connected.*"
          timeout: 45000
      # ConnectAppRow is one accessible Pressable labelled "<title> <pill>" ("Gmail Connected"); its
      # subtitle ("Fixture Gmail", the account name) is a hidden child, so only the label is matchable
      # (run 45994571354: the screenshot showed Gmail + Connected + Fixture Gmail, yet the assert failed).
- assertVisible: ".*Gmail (Connected|已连接).*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-integrations
- tapOn: "Add custom"
- tapOn: "MCP server"
- extendedWaitUntil:
    visible: "Remote MCP server"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-integrations-advanced
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///voice"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          # The Provider row is one accessible MenuPicker: label "Provider", value "This device". Maestro
          # may expose either, so accept both (the screenshot that follows is taken after 3s of settling).
          visible: ".*(This device|Provider).*"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-voice
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///ai-data-sharing"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "AI data sharing"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-ai-data-sharing
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///labs"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Board"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10b-labs
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///routine?botId=${RAKAZO_SCREENSHOT_BOT_ID}&botName=Researcher&routineId=${RAKAZO_SCREENSHOT_ROUTINE_ID}"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: ".*Weekly fixture review.*"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-routine
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///routine-runs?routineId=${RAKAZO_SCREENSHOT_ROUTINE_ID}&botName=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: ".*Run history.*"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11b-routine-runs
# Run 46112983730: on the busy runner bots/get took 11.7s, past the app's 8s request timeout, and the
# screen sat on "Could not reach the server" for the whole 90s. Reopening the screen is what a person
# does, so reopen it (three tries, 40s each) instead of waiting out one dead load.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///bot-settings?botId=${RAKAZO_SCREENSHOT_BOT_ID}"
      - tapOn:
          text: "Open"
          optional: true
      # Wait for the bot to load (the avatar only renders then) BEFORE touching Advanced: run
      # 46011113796 tapped it ~50ms before bots/get answered and the screen crashed on
      # `bot.sectionId` of null (an app bug, fixed by patch-app-testids-and-null-guard.py).
      - extendedWaitUntil:
          visible:
            id: "bot-settings-avatar"
          timeout: 40000
- scrollUntilVisible:
    element:
      id: "bot-settings-advanced"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "bot-settings-advanced"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-bot-settings
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///bot-profile?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "bot-profile-routines"
          timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 13-bot-profile
- tapOn: "Bot actions"
- extendedWaitUntil:
    visible: "Clear conversation"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 14-bot-profile-menu
- tapOn: "Delete…"
- extendedWaitUntil:
    visible: ".*(will be|are) deleted too.*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 14-bot-delete-warning
- tapOn: "Cancel"
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///group-settings?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: ".*Delete group.*"
          timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 15-group-settings
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///computer?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: ".*Take control.*|.*Open computer.*"
          timeout: 60000
      # The computer boots and its desktop loads after the page opens; Maestro cannot see inside the
      # screen, so give it a few seconds before the shot.
- extendedWaitUntil:
    visible: "Desktop never shows this text"
    timeout: 8000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 16-computer
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///profile"
      - tapOn:
          text: "Open"
          optional: true
      - scrollUntilVisible:
          element:
            id: "profile-delete-account"
          direction: DOWN
          timeout: 60000
          visibilityPercentage: 50
- tapOn:
    id: "profile-delete-account"
- extendedWaitUntil:
    visible: ".*Delete your account.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 17-delete-prompt
- tapOn: "Cancel"
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///general"
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "settings-language-row"
          timeout: 45000
- tapOn:
    id: "settings-language-row"
- extendedWaitUntil:
    visible: "Deutsch"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 18-language
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///account"
      - tapOn:
          text: "Open"
          optional: true
      - scrollUntilVisible:
          element:
            id: "settings-row-artifacts"
          direction: DOWN
          timeout: 45000
- assertVisible:
    id: "settings-row-artifacts"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 19-account-artifacts
- tapOn:
    id: "settings-row-artifacts"
# Only the Artifacts screen has the search field; the sheet must have closed.
- extendedWaitUntil:
    visible: "Search artifacts.*"
    timeout: 45000
- assertNotVisible: "General"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 20-artifacts
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*Could not reach the server.*"
          commands:
            - tapOn:
                text: "Back"
                optional: true
      - openLink: "rakazo:///general"
      - tapOn:
          text: "Open"
          optional: true
      - scrollUntilVisible:
          element: "Haptics"
          direction: UP
          timeout: 45000
          visibilityPercentage: 100
          centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 21-haptics
- tapOn:
    text: "Haptics"
    index: 1
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 22-haptics-toggled
- tapOn:
    text: "Haptics"
    index: 1
