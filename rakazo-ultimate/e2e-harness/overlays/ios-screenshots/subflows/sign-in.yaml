appId: com.rakazo.app
---
- runFlow: launch-app.yaml
# Run 46117312164: on the loaded runner the sign-in answered only after ~60s (the `me` call was
# cancelled by the client at 07:06:27), past the old 45s wait, in two flows in a row. Wait longer.
# Run 46112983730: under load the first capabilities fetch failed and the screen said
# "Could not load sign-in options" with a Retry button (no "Sign in" link). Tap Retry, as a person would.
- runFlow:
    when:
      visible: ".*Could not load sign-in options.*"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*Could not load sign-in options.*"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: ".*Could not load sign-in options.*"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Sign up for Rakazo"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Rakazo"
    timeout: 60000
- tapOn: "Email"
- inputText: ${RAKAZO_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# The sign-in POST can outlast the app's 8s request timeout while the shared runner is busy
# (the screen then says "Request timed out" and clears the password). A person taps Sign in
# again; keep doing that until the inbox or Account appears, or the Keychain save error does
# (that last case still counts as signed in when Account is visible).
# Success is Account, the signup survey, the inbox (Personal / Screenshot User — run 46117312164
# landed on the inbox, which does not show the word Account), or a timeout we will retry.
- retry:
    maxRetries: 4
    commands:
      - extendedWaitUntil:
          visible: "Account|.*How did you hear about us.*|Could not save your sign-in|.*Request timed out.*|Personal|Screenshot User"
          timeout: 90000
      - runFlow:
          when:
            visible: ".*Request timed out.*"
          commands:
            - tapOn: "Password"
            - eraseText: 60
            - inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
            - hideKeyboard
            - tapOn: "Sign in"
      # Fail this attempt (and retry) if we are still on the timeout screen after submitting again.
      - extendedWaitUntil:
          notVisible: ".*Request timed out.*"
          timeout: 90000
- runFlow:
    when:
      visible: ".*Could not save your sign-in.*"
    commands:
      - assertVisible: "Account|Personal|Screenshot User"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
# A new account answers the signup survey before the inbox.
- extendedWaitUntil:
    visible: "Account|.*How did you hear about us.*|Personal|Screenshot User"
    timeout: 90000
